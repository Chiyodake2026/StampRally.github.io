<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>移転しました｜みんなで川をつくろう</title>
<script>
/*
 * 旧サイト（https://koeisuzuki.github.io/Chiyodake/）に置く、新しいサイトへの転送ページです。
 * 転送先は、下の NEW_BASE です。URLを変えたとき（リポジトリ名の変更、独自ドメインの設定など）は、ここだけを書き換えます。
 * 旧URLのQRコードや、保存されたリンクを開いた人を、新しいURLへ移動させます。
 *   ・?stamp=river のようなURLの内容（クエリ）は、そのまま引き継ぎます。
 *   ・この端末に保存されている参加者ID・取得済みスタンプを、URLの「#m=…」に入れて渡します。
 *     （サイトのURLが変わると、ブラウザの保存データは引き継がれないため。受け取り側は js/app.js の importMigration）
 *     「#」より後ろの部分は、サーバーには送信されません。
 * index.html と 404.html は、同じ内容です（下の階層のURLを開かれたときにも、転送するため）。
 */
(function () {
  var NEW_BASE = "https://chiyodake2026.github.io"; // ← 新しいサイトのURL（末尾の / は付けない）
  var OLD_PATH_PREFIX = "/Chiyodake";                 // ← 旧サイトのURLの、パスの先頭

  var path = location.pathname;
  if (path.indexOf(OLD_PATH_PREFIX) === 0) path = path.slice(OLD_PATH_PREFIX.length);
  if (path === "") path = "/";

  var hash = location.hash;
  if (path === "/" || path === "/index.html") {
    try {
      var id = localStorage.getItem("stamp_rally_participant_id");
      if (id) {
        var data = {
          v: 1,
          id: id,
          stamps: JSON.parse(localStorage.getItem("stamp_rally_stamps") || "[]"),
          times: JSON.parse(localStorage.getItem("stamp_rally_stamp_times") || "{}"),
          pending: JSON.parse(localStorage.getItem("stamp_rally_pending") || "[]"),
          survey: localStorage.getItem("stamp_rally_survey_submitted") || ""
        };
        hash = "#m=" + btoa(JSON.stringify(data)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
    } catch (e) { /* 保存データが読めなくても、転送は行う */ }
  }
  location.replace(NEW_BASE + path + location.search + hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://chiyodake2026.github.io/"></noscript>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#30557e;background:#ecf5f9;margin:0;padding:32px 20px;line-height:1.8}a{color:#30557e}</style>
</head>
<body>
<p><strong>サイトが新しいURLに移転しました。</strong></p>
<p>自動で移動しない場合は、こちらを開いてください：<br><a href="https://chiyodake2026.github.io/">https://chiyodake2026.github.io/</a></p>
</body>
</html>
